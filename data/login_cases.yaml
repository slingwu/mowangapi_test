- title: 正常登录
  request:
    mobile: "1800000001"
    password: "123456"
    device_type: "android"
  expected:
    code: 0
    msg: "success"

- title: 密码错误
  request:
      mobile: "1800000001"
      password: "1234567"
      device_type: "android"
  expected:
    code: 1004
    msg: "password error"

- title: 手机号为空
  request:
      mobile: ""
      password: "123456"
      device_type: "android"
  expected:
    code: 1001
    msg: "mobile is required"